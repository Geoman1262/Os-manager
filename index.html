<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OS Management</title><style>
:root{--n:#172235;--n2:#263a54;--g:#c5a15b;--bg:#f6f4ee;--line:#e8e5dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202938;font-family:Tahoma,Arial}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--n);color:white;padding:20px}.brand{font-size:27px;font-weight:bold;padding:8px 10px 24px;border-bottom:1px solid #ffffff30}.brand small{display:block;color:var(--g);font-size:10px;letter-spacing:3px}.nav{display:grid;gap:5px;margin-top:18px}.nav button{background:none;border:0;color:#e7eaf0;text-align:right;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:var(--n2);border-right:3px solid var(--g)}.main{min-width:0}.top{background:white;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.top input{width:110px}.content{padding:24px;max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.head h1{font-size:22px;margin:0 0 5px}.muted{font-size:12px;color:#7a8492}.btn{border:0;background:var(--n2);color:white;border-radius:8px;padding:10px 14px;cursor:pointer}.gold{background:var(--g);color:#172235}.light{background:white;color:#222;border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:11px}.card{padding:17px;border-top:3px solid var(--g);text-align:right}.card.click{cursor:pointer}.card small{color:#788292}.card b{display:block;font-size:22px;margin-top:12px}.panel{padding:18px;margin-bottom:15px}.panel h3{margin:0 0 14px;font-size:15px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px;font-size:12px}th,td{text-align:right;padding:12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#788292;background:#fbfaf7}.link{border:0;background:none;color:#9b7839;text-decoration:underline;cursor:pointer}.badge{padding:4px 8px;border-radius:20px;background:#eee;font-size:11px}.ok{background:#e9f5ee;color:#287b58}.no{background:#fff0f0;color:#b94c4c}input,select,textarea{border:1px solid #ddd9cf;border-radius:8px;padding:10px;width:100%;background:white}.modalback{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal{background:white;border-radius:12px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:5px;font-size:12px;color:#788292}.items{display:grid;gap:8px;margin-top:12px}.item{display:grid;grid-template-columns:2fr .7fr 1fr .8fr 1fr .8fr auto;gap:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.summary div{border:1px solid var(--line);padding:12px;border-radius:8px}.empty{text-align:center;padding:25px;color:#788292}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:10px}.brand{padding:3px 8px 10px}.nav{display:flex;overflow:auto;margin-top:8px}.nav button{white-space:nowrap;padding:9px}.content{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.top{align-items:flex-start;gap:8px;flex-direction:column}.head{align-items:flex-start;flex-direction:column}.item{grid-template-columns:1fr 1fr}.item label:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}@media print{.side,.top,.actions,.btn{display:none!important}.app{display:block}}
</style></head><body><div class="app"><aside class="side"><div class="brand">OS<small>ONLINE SHOPPING</small></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><b id="title">لوحة التحكم</b><div class="muted">إدارة المبيعات والطلبيات والحسابات</div></div><label class="muted">سعر الصرف <input id="fx" type="number" value="90000"> ل.ل / $</label></header><div id="view" class="content"></div></main></div><div id="back" class="modalback"><div id="modal" class="modal"></div></div><script src="/app.js"></script></body></html>
